<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DronePizza Leveringer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<h1>DronePizza Leveringer</h1>
<table id="deliveriesTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Adresse</th>
        <th>Forventet Levering</th>
        <th>Faktisk Levering</th>
        <th>Drone</th>
        <th>Handlinger</th>
    </tr>
    </thead>
    <tbody id="levering-table-body">
    </tbody>
</table>
<br>
<button onclick="addDrone()">Tilføj Ny Drone</button>
<button onclick="simulateDelivery()">Tilføj Ny Levering</button>

<script>
    const apiBase = 'http://localhost:8080';


    async function fetchDeliveries() {
        const response = await fetch('/deliveries'); // Henter fra API
        const deliveries = await response.json();

        const tableBody = document.getElementById('levering-table-body');
        tableBody.innerHTML = ''; // Tømmer tabellen

        deliveries.forEach(delivery => {
            const forventetLevering = delivery.forventetLevering
                ? new Date(delivery.forventetLevering).toLocaleString('da-DK', {
                    hour: '2-digit',
                    minute: '2-digit',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                })
                : 'Ikke angivet';

            const row = document.createElement('tr');
            row.innerHTML = `
            <td>${delivery.leveringId}</td>
            <td>${delivery.adresse}</td>
            <td>${forventetLevering}</td>
            <td>${delivery.faktiskLevering || 'Ikke leveret'}</td>
            <td>${delivery.drone ? delivery.drone.serialUuid : 'Ingen drone'}</td>
            <td>
                <button onclick="scheduleDrone(${delivery.leveringId})">Tilknyt</button>
                <button onclick="finishDelivery(${delivery.leveringId})">Afslut</button>
            </td>
        `;
            tableBody.appendChild(row);
        });
    }

    // Tilføj en ny drone
    async function addDrone() {
        const response = await fetch(`${apiBase}/drones/add`, { method: 'POST' });
        if (response.ok) {
            alert('Drone oprettet!');
            fetchDeliveries();
        } else {
            alert('Kunne ikke oprette drone.');
        }
    }

    async function fetchPizzas() {
        return [
            { id: 1, name: "Margherita", price: 50 },
            { id: 2, name: "Pepperoni", price: 60 },
            { id: 3, name: "Hawaii", price: 65 },
            { id: 4, name: "Vegetariana", price: 55 },
            { id: 5, name: "Capricciosa", price: 70 }
        ];
    }



    //lav en levering
    async function simulateDelivery() {
        const pizzas = await fetchPizzas();
        if (pizzas.length === 0) {
            alert('Ingen pizzaer tilgængelige!');
            return;
        }

        const pizzaOptions = pizzas.map(pizza =>
            `<option value="${pizza.id}">${pizza.name} - ${pizza.price} DKK</option>`
        ).join('');

        const modal = document.createElement('div');
        modal.innerHTML = `
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;">
            <div style="background: white; padding: 20px; border-radius: 5px;">
                <h2>Tilføj Ny Levering</h2>
                <label for="pizzaSelect">Vælg en pizza:</label>
                <select id="pizzaSelect">${pizzaOptions}</select>
                <br><br>
                <label for="adresseInput">Indtast adresse:</label>
                <input id="adresseInput" type="text" placeholder="Adresse" />
                <br><br>
                <button onclick="submitDelivery()">Bekræft</button>
                <button onclick="closeModal(this)">Annuller</button>
            </div>
        </div>
    `;
        document.body.appendChild(modal);
    }
//tilføj levering
    async function submitDelivery() {
        const pizzaId = document.getElementById('pizzaSelect').value;
        const adresse = document.getElementById('adresseInput').value;

        if (!pizzaId || !adresse) {
            alert('Pizza og adresse skal udfyldes!');
            return;
        }

        const response = await fetch(`${apiBase}/deliveries/add?pizzaId=${pizzaId}&adresse=${adresse}`, {
            method: 'POST'
        });

        if (response.ok) {
            alert('Levering oprettet!');
            fetchDeliveries();
            // Fjern modal-dialogen efter en succesfuld submission
            const modal = document.querySelector('div[style*="position: fixed"]');
            if (modal) modal.remove();
        } else {
            alert('Kunne ikke oprette levering.');
        }
    }
    function closeModal(button) {
        const modal = button.closest('div[style*="position: fixed"]');
        if (modal) {
            modal.remove();
        } else {
            console.error('Kunne ikke finde modal-dialogen.');
        }
    }
    //tilføj en drone til en levering
    async function scheduleDrone(leveringId) {
        const response = await fetch(`${apiBase}/deliveries/schedule?leveringId=${leveringId}`, {
            method: 'POST'
        });
        if (response.ok) {
            alert('Drone tilknyttet levering!');
            fetchDeliveries();
        } else {
            alert('Kunne ikke tilknytte drone.');
        }
    }

    // Afslut en levering
    async function finishDelivery(leveringId) {
        const response = await fetch(`${apiBase}/deliveries/finish?leveringId=${leveringId}`, {
            method: 'POST'
        });
        if (response.ok) {
            alert('Levering afsluttet!');
            fetchDeliveries();
        } else {
            const error = await response.text();
            alert(`Kunne ikke afslutte levering: ${error}`);
        }
    }

    // Opdater listen hvert 60. sekund
    setInterval(fetchDeliveries, 60000);+

    fetchDeliveries();
</script>
</body>
</html>
